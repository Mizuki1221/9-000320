<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D Viewer</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #f5f5f5;
    }
  </style>
</head>

<body>

<model-viewer
  src="./9-000320.glb"
  camera-controls
  auto-rotate
  exposure="1"
  shadow-intensity="0.5"
  shadow-softness="0.5">
</model-viewer>

</body>
</html>
